<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="520" height="350">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecdeff"/>
    </radialGradient>
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8b830"/>
      <stop offset="100%" stop-color="#fff8b0"/>
    </linearGradient>
  </defs>

  <!-- TAIL (drawn first — behind body) -->
  <g id="tail">
    <path d="M 82 193 C 52 177, 24 152, 30 118 C 36 84, 62 92, 57 118 C 52 144, 28 154, 37 187"
          fill="none" stroke="#ff6b9d" stroke-width="8" stroke-linecap="round"/>
    <path d="M 82 199 C 50 185, 20 158, 26 124 C 32 90, 58 99, 53 124 C 48 150, 26 160, 35 193"
          fill="none" stroke="#ff9b4e" stroke-width="7" stroke-linecap="round"/>
    <path d="M 82 205 C 53 193, 27 167, 33 134 C 39 101, 62 109, 58 133 C 54 157, 34 167, 42 198"
          fill="none" stroke="#ffe566" stroke-width="6" stroke-linecap="round"/>
    <path d="M 82 211 C 57 201, 34 175, 40 143 C 46 111, 65 118, 62 141 C 59 164, 41 173, 49 203"
          fill="none" stroke="#66d9a0" stroke-width="5" stroke-linecap="round"/>
    <path d="M 82 217 C 62 209, 42 183, 48 152 C 54 121, 68 128, 66 150 C 64 172, 48 179, 55 208"
          fill="none" stroke="#66b2ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 82 222 C 66 217, 50 191, 56 161 C 62 131, 72 137, 70 158 C 68 179, 53 185, 60 213"
          fill="none" stroke="#cc88ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- BACK LEGS -->
  <g id="leg_back">
    <!-- near back leg -->
    <path d="M 120 262 C 118 282, 116 302, 114 323 L 128 323 C 130 302, 132 282, 134 262 Z"
          fill="#f0e4ff" stroke="#c070d8" stroke-width="2"/>
    <ellipse cx="121" cy="326" rx="11" ry="5.5" fill="#d090e0" stroke="#a050c0" stroke-width="1.5"/>
    <!-- far back leg -->
    <path d="M 144 258 C 142 278, 140 298, 138 319 L 150 319 C 152 298, 154 278, 156 258 Z"
          fill="#e8d8ff" stroke="#c070d8" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="144" cy="322" rx="10" ry="5" fill="#d090e0" stroke="#a050c0" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- BODY -->
  <g id="body">
    <ellipse cx="210" cy="210" rx="130" ry="70" fill="url(#bodyGrad)" stroke="#c070d8" stroke-width="2.5"/>
  </g>

  <!-- FRONT LEGS -->
  <g id="leg_front">
    <!-- near front leg -->
    <path d="M 286 264 C 284 284, 282 304, 280 325 L 294 325 C 296 304, 298 284, 300 264 Z"
          fill="#f0e4ff" stroke="#c070d8" stroke-width="2"/>
    <ellipse cx="287" cy="328" rx="11" ry="5.5" fill="#d090e0" stroke="#a050c0" stroke-width="1.5"/>
    <!-- far front leg -->
    <path d="M 308 260 C 306 280, 304 300, 302 321 L 314 321 C 316 300, 318 280, 320 260 Z"
          fill="#e8d8ff" stroke="#c070d8" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="308" cy="324" rx="10" ry="5" fill="#d090e0" stroke="#a050c0" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- HEAD (neck + head shape + muzzle + ear) -->
  <g id="head">
    <!-- neck -->
    <path d="M 290 178 C 310 148, 330 120, 348 108
             L 368 110 C 366 128, 358 150, 346 168
             C 330 177, 312 181, 290 178 Z"
          fill="url(#bodyGrad)" stroke="#c070d8" stroke-width="2.5"/>
    <!-- head oval -->
    <ellipse cx="378" cy="148" rx="50" ry="43" fill="url(#bodyGrad)" stroke="#c070d8" stroke-width="2.5"/>
    <!-- muzzle -->
    <ellipse cx="416" cy="163" rx="25" ry="18" fill="#f8f0ff" stroke="#c070d8" stroke-width="2"/>
    <!-- nostril -->
    <ellipse cx="422" cy="168" rx="4.5" ry="3.2" fill="#dfc0f8"/>
    <!-- ear outer -->
    <path d="M 352 110 L 344 80 L 368 103 Z" fill="#f0e4ff" stroke="#c070d8" stroke-width="2" stroke-linejoin="round"/>
    <!-- ear inner (pink) -->
    <path d="M 352 108 L 348 85 L 365 103 Z" fill="#ffccee"/>
  </g>

  <!-- HORN -->
  <g id="horn">
    <path d="M 348 108 L 330 52 L 368 101 Z" fill="url(#hornGrad)" stroke="#bf9018" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- spiral stripe lines -->
    <path d="M 334 88 Q 350 81 362 88" fill="none" stroke="#bf9018" stroke-width="1.2" opacity="0.6"/>
    <path d="M 333 70 Q 347 63 358 70" fill="none" stroke="#bf9018" stroke-width="1.2" opacity="0.6"/>
    <path d="M 332 54 Q 344 48 352 54" fill="none" stroke="#bf9018" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- MANE (rainbow strands along neck, drawn over head) -->
  <g id="mane">
    <path d="M 347 107 C 328 100, 306 114, 295 133 C 284 152, 289 172, 278 191 C 267 210, 248 215, 240 228"
          fill="none" stroke="#ff6b9d" stroke-width="9" stroke-linecap="round"/>
    <path d="M 349 111 C 332 106, 311 121, 301 140 C 291 159, 297 178, 287 197 C 277 216, 259 221, 251 234"
          fill="none" stroke="#ff9b4e" stroke-width="7" stroke-linecap="round"/>
    <path d="M 350 115 C 335 111, 316 125, 307 144 C 298 163, 304 181, 295 199"
          fill="none" stroke="#ffe566" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 350 119 C 337 116, 320 129, 312 148 C 304 167, 310 184, 302 202"
          fill="none" stroke="#66d9a0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 350 123 C 339 120, 323 133, 316 152 C 309 171, 315 187, 307 205"
          fill="none" stroke="#66b2ff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 350 127 C 341 124, 326 136, 319 155 C 312 174, 318 189, 310 207"
          fill="none" stroke="#cc88ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- EYE LEFT (near eye — large and cute) -->
  <g id="eye_left">
    <!-- sclera -->
    <ellipse cx="392" cy="135" rx="13" ry="15" fill="white" stroke="#33224a" stroke-width="2"/>
    <!-- iris + pupil -->
    <ellipse cx="394" cy="137" rx="8" ry="10" fill="#553366"/>
    <!-- highlight -->
    <circle cx="397" cy="132" r="3.5" fill="white"/>
    <!-- eyelash / brow -->
    <path d="M 381 123 C 386 118, 397 117, 406 120" fill="none" stroke="#33224a" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- EYE RIGHT (far eye — faintly visible) -->
  <g id="eye_right">
    <ellipse cx="374" cy="137" rx="9" ry="10" fill="white" stroke="#33224a" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="375" cy="138" rx="5" ry="6" fill="#553366" opacity="0.4"/>
  </g>

  <!-- MOUTH (friendly smile) -->
  <g id="mouth">
    <path d="M 409 170 C 413 176, 420 177, 424 173" fill="none" stroke="#9966aa" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
